# iE pilot over sampling, budget and prompt knobs (memo section 10.4, Usage 1).
# No training involved; the point is the machinery (noise floor, gains, Jacobian prior)
# and a first look at which behaviour coordinates these knobs can move.
name: pilot
base_submission: submissions/v0_long
task_pool: data/sound_tasks.txt
batch_size: 24
seed: 0

eval:
  max_time_minutes: 34      # = 5 Kaggle minutes at concurrency 8 (IMPLEMENTATION.md 7.2)
  concurrency: 8
  max_turns: 250
  max_tool_calls: 100       # used only if no knob controls it

# Transformed scale u: identity or log. probe_step and trust are in u units.
knobs:
  - name: temperature
    kind: sampling
    key: temperature
    x0: 0.2
    bounds: [0.1, 1.0]
    probe_step: 0.4
    trust: 0.3
  - name: thinking_budget
    kind: sampling
    key: thinking_config.thinking_budget
    scale: log
    integer: true
    x0: 512
    bounds: [64, 2048]
    probe_step: -1.0          # 512 -> 188
    trust: 0.7
  - name: read_window
    kind: prompt_regex
    file: prompts/system.md
    pattern: '\(\d+ lines or fewer\)'
    replacement: '({v} lines or fewer)'
    scale: log
    integer: true
    x0: 60
    bounds: [20, 150]
    probe_step: 0.7           # 60 -> 121
    trust: 0.5
  - name: max_tool_calls
    kind: eval
    key: evaluation.max_tool_calls
    integer: true
    x0: 100
    bounds: [30, 100]
    probe_step: -50
    trust: 25

# Target operating point b on raw scales (Kaggle-equivalent seconds). Resolution is
# tracked in every y but is not a controlled coordinate; it gates the final confirmation.
targets:
  - {coord: garbled_call_rate,    value: 0.01}
  - {coord: repeat_loop_rate,     value: 0.02}
  - {coord: source_edit_rate,     value: 0.85}
  - {coord: first_edit_s_kaggle,  value: 120}
  - {coord: compactions_per_task, value: 0.4}
  - {coord: empty_patch_rate,     value: 0.08}

gain:
  P: 1.0
  beta: 0.6
  rcond: 0.1

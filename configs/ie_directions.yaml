# iE over trained preference directions (memo section 10.5, Usage 2): the merge weights of the
# format and decisiveness adapters, plus temperature, controlled toward the same operating
# point as the pilot. Each draw rebuilds the merged adapter and restarts the server (~5 min).
name: directions
base_submission: submissions/v0_long
task_pool: data/sound_tasks.txt
batch_size: 24
seed: 1

eval:
  max_time_minutes: 34
  concurrency: 8
  max_turns: 250
  max_tool_calls: 100

directions:
  - {name: format,   path: adapters_out/format_r16_v2}
  - {name: decisive, path: adapters_out/decisive_r16}

knobs:
  - name: w_format
    kind: adapter_weight
    direction: format
    x0: 1.0
    bounds: [-0.5, 2.0]
    probe_step: -0.5
    trust: 0.5
  - name: w_decisive
    kind: adapter_weight
    direction: decisive
    x0: 0.0
    bounds: [-0.5, 2.0]
    probe_step: 1.0
    trust: 0.5
  - name: temperature
    kind: sampling
    key: temperature
    x0: 0.2
    bounds: [0.1, 1.0]
    probe_step: 0.4
    trust: 0.3

targets:
  - {coord: garbled_call_rate,    value: 0.01}
  - {coord: repeat_loop_rate,     value: 0.02}
  - {coord: source_edit_rate,     value: 0.85}
  - {coord: first_edit_s_kaggle,  value: 120}
  - {coord: compactions_per_task, value: 0.4}
  - {coord: empty_patch_rate,     value: 0.08}

gain:
  P: 1.0
  beta: 0.6
  rcond: 0.1
